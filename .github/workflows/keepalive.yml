# ─────────────────────────────────────────────────────────────────────────
#  Vigilancia del Pabellón 414
#
#  Cuida cuatro cosas, en orden de gravedad si fallan:
#
#   1. El dominio pabellon414.com — lo llevan impreso los QR de la pared.
#      Si caduca, esas etiquetas no tienen arreglo.
#   2. El respaldo de direcciones — lo único que permitiría resucitarlas.
#   3. La base de Supabase — el plan gratuito PAUSA los proyectos sin
#      actividad suficiente, y con ella se van los textos y las fotos.
#   4. Que el sitio responda.
#
#  Y se mantiene vivo a sí mismo: GitHub desactiva los flujos programados
#  si el repositorio pasa 60 días sin commits.
#
#  REGLA DE DISEÑO: ningún fallo puede impedir que corran las demás
#  comprobaciones. Antes, una caída de Supabase cortaba el flujo en el
#  primer paso y se llevaba por delante el aviso de vencimiento del
#  dominio y el sello que mantiene vivo al propio flujo. Por eso cada
#  paso lleva `if: always()` y el veredicto se da al final.
# ─────────────────────────────────────────────────────────────────────────
name: Vigilancia del Pabellón 414

on:
  schedule:
    # Cuatro veces al día, a horas y minutos deliberadamente irregulares.
    # GitHub encola las tareas programadas y las que caen en punto compiten
    # con las de medio mundo: pueden retrasarse mucho o directamente
    # saltarse. En minutos impares salen a tiempo.
    - cron: "17 2 * * *"
    - cron: "43 8 * * *"
    - cron: "11 14 * * *"
    - cron: "37 20 * * *"
  workflow_dispatch:
    inputs:
      simular_fallo:
        description: "Simular que Supabase no responde (para probar que un fallo no corta el resto)"
        type: boolean
        default: false

permissions:
  contents: write

# Dos ejecuciones a la vez se pisarían al escribir en el repositorio.
concurrency:
  group: vigilancia
  cancel-in-progress: false

env:
  SUPABASE_URL: https://ffsafqgzggysvxumwemh.supabase.co
  # La "anon key" es pública por diseño: ya vive en config.js y lo que
  # protege los datos son las políticas RLS, no el secreto de esta clave.
  ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmc2FmcWd6Z2d5c3Z4dW13ZW1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NjUxNzAsImV4cCI6MjEwMDU0MTE3MH0.uJtLdBPdE4QQsyHdKSw3zcfq7Ey9ux_VhEEG3SuEEec' }}

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ── 1. Supabase ────────────────────────────────────────────────────
      - name: Consultar la base
        id: base
        run: |
          # Cuatro consultas distintas y no una sola: Supabase mide volumen de
          # actividad, no si hubo un latido. Un ping diario le redondeaba a
          # cero y aun así nos llegó un aviso de pausa.
          #
          # Cada una se reintenta antes de darla por fallida: un corte de red
          # de un segundo no debe disparar una alarma en falso.
          if [ "${{ inputs.simular_fallo }}" = "true" ]; then
            echo "SIMULACIÓN: se finge que la base no responde."
            echo "estado=fallo" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          fallos=0
          for ruta in \
            "piezas?select=id&limit=1" \
            "piezas?select=id,codigo,nombre_comun&order=orden_display&limit=50" \
            "imagenes?select=id,pieza_id&limit=50" \
            "piezas?select=id&estado_pieza=eq.Bueno&limit=10"
          do
            codigo=000
            for intento in 1 2 3; do
              codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 \
                "$SUPABASE_URL/rest/v1/$ruta" \
                -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" || echo 000)
              [ "$codigo" = "200" ] && break
              sleep 5
            done
            echo "  $codigo  <- $ruta"
            [ "$codigo" != "200" ] && fallos=$((fallos+1))
          done

          if [ "$fallos" != "0" ]; then
            echo "::error::Supabase falló en $fallos de 4 consultas. Puede estar pausada: entra a supabase.com/dashboard y toca Restore."
            echo "estado=fallo" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Base activa. Contador de inactividad reiniciado."
          echo "estado=bien" >> "$GITHUB_OUTPUT"

      # ── 2. El sitio ────────────────────────────────────────────────────
      - name: Comprobar que el sitio siga en pie
        id: sitio
        if: always()
        run: |
          # pabellon414.com es lo que llevan impreso los QR, así que es lo que
          # de verdad hay que vigilar. El dominio de Vercel se consulta solo
          # para distinguir un fallo del sitio de uno del dominio o del DNS.
          medir(){ curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$1" || echo 000; }
          principal=$(medir https://pabellon414.com)
          [ "$principal" != "200" ] && { sleep 10; principal=$(medir https://pabellon414.com); }
          respaldo=$(medir https://401-amber.vercel.app)
          echo "pabellon414.com      -> HTTP $principal"
          echo "401-amber.vercel.app -> HTTP $respaldo"

          if [ "$principal" != "200" ]; then
            if [ "$respaldo" = "200" ]; then
              echo "::error::pabellon414.com no responde (HTTP $principal) pero Vercel sí. Es el dominio o el DNS: revisa Cloudflare y que el dominio siga renovado. Los QR impresos apuntan a este dominio."
            else
              echo "::error::No responde ni el dominio ni Vercel ($principal / $respaldo). El problema es del sitio, no del DNS."
            fi
            echo "estado=fallo" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Sitio en pie."
          echo "estado=bien" >> "$GITHUB_OUTPUT"

      # ── 3. El vencimiento del dominio ──────────────────────────────────
      # De todo el sistema, lo único irreversible son los QR ya pegados en la
      # pared: llevan escrito este dominio. Si caduca, cualquiera puede
      # comprarlo y esas etiquetas pasan a llevar al sitio de un desconocido.
      - name: Vigilar el vencimiento del dominio
        id: dominio
        if: always()
        run: |
          fecha=$(curl -s --max-time 25 "https://rdap.verisign.com/com/v1/domain/PABELLON414.COM" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(e['eventDate'] for e in d['events'] if e['eventAction']=='expiration'))" 2>/dev/null || true)

          if [ -z "$fecha" ]; then
            # No saber la fecha no es una avería: se avisa y se sigue.
            echo "::warning::No se pudo consultar la fecha de vencimiento del dominio."
            echo "estado=desconocido" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          dias=$(( ( $(date -u -d "$fecha" +%s) - $(date -u +%s) ) / 86400 ))
          echo "pabellon414.com vence el ${fecha%%T*} — faltan $dias días."

          if [ "$dias" -lt 30 ]; then
            echo "::error::El dominio vence en $dias días. Renuévalo ya: si caduca, los QR de la pared dejan de funcionar y no hay forma de arreglarlos sin reimprimirlos."
            echo "estado=fallo" >> "$GITHUB_OUTPUT"
          elif [ "$dias" -lt 60 ]; then
            echo "::warning::El dominio vence en $dias días. Conviene renovarlo con tiempo."
            echo "estado=bien" >> "$GITHUB_OUTPUT"
          else
            echo "estado=bien" >> "$GITHUB_OUTPUT"
          fi

      # ── 4. El respaldo de direcciones ──────────────────────────────────
      # Es lo único que permitiría resucitar los QR ya pegados si se perdiera
      # todo. Si se agrega una pieza y su dirección no queda anotada ahí, esa
      # etiqueta sería irrecuperable. Por eso no depende de que nadie se acuerde.
      - name: Mantener al día el respaldo de direcciones
        id: respaldo
        if: always()
        run: |
          if [ "${{ steps.base.outputs.estado }}" != "bien" ]; then
            echo "La base no respondió; no se toca el respaldo para no escribir una lista incompleta."
            exit 0
          fi

          python3 herramientas/generar-direcciones.py

          if [ -z "$(git status --porcelain qr-direcciones.csv QR-DIRECCIONES.md)" ]; then
            echo "El respaldo ya estaba al día."
            exit 0
          fi

          echo "Hay piezas nuevas o cambiadas: se actualiza el respaldo."
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qr-direcciones.csv QR-DIRECCIONES.md
          git commit -m "Actualizar el respaldo de direcciones de los QR"
          # Reintentos: entre el checkout y el push puede haber entrado otro
          # commit, y perder el respaldo por un empujón fallido sería absurdo.
          for intento in 1 2 3; do
            git pull --rebase --quiet origin "$GITHUB_REF_NAME" || true
            git push && exit 0
            echo "Empujón fallido, reintento $intento."
            sleep 5
          done
          echo "::error::No se pudo guardar el respaldo actualizado."
          exit 1

      # ── 5. Mantenerse vivo a sí mismo ──────────────────────────────────
      # GitHub desactiva los flujos programados si el repositorio pasa 60 días
      # sin commits. Este sello los evita. Corre pase lo que pase con los pasos
      # anteriores: si una caída de Supabase impidiera sellar, el vigilante
      # acabaría apagándose por culpa de lo que vigila.
      - name: Sello de actividad
        if: always()
        run: |
          sello=.github/ultima-comprobacion.txt
          hoy=$(date -u +%Y-%m-%d)

          # Por antigüedad y no por día del calendario: si la ejecución del
          # día 1 se retrasa o se salta, el sello se pone igual en la
          # siguiente. Se cura solo en vez de depender de una fecha exacta.
          anterior=$(sed -n 's/.*: //p' "$sello" 2>/dev/null | head -1)
          if [ -n "$anterior" ]; then
            edad=$(( ( $(date -u +%s) - $(date -u -d "$anterior" +%s) ) / 86400 ))
            echo "Último sello: $anterior (hace $edad días)."
            if [ "$edad" -lt 20 ]; then
              echo "Todavía no hace falta: el margen de GitHub son 60 días."
              exit 0
            fi
          fi

          echo "Ultima comprobacion automatica: $hoy" > "$sello"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$sello"
          git commit -m "Sello de actividad" || exit 0
          for intento in 1 2 3; do
            git pull --rebase --quiet origin "$GITHUB_REF_NAME" || true
            git push && exit 0
            echo "Empujón fallido, reintento $intento."
            sleep 5
          done
          echo "::error::No se pudo escribir el sello de actividad. Si esto se repite 60 días, GitHub apagará esta vigilancia."
          exit 1

      # ── 6. Veredicto ───────────────────────────────────────────────────
      - name: Resumen
        if: always()
        run: |
          echo "base:    ${{ steps.base.outputs.estado }}"
          echo "sitio:   ${{ steps.sitio.outputs.estado }}"
          echo "dominio: ${{ steps.dominio.outputs.estado }}"

          if [ "${{ inputs.simular_fallo }}" = "true" ]; then
            echo "Era una simulación: los pasos siguientes corrieron igual, que es lo que se quería comprobar."
            exit 0
          fi

          malos=""
          [ "${{ steps.base.outputs.estado }}"    = "fallo" ] && malos="$malos base"
          [ "${{ steps.sitio.outputs.estado }}"   = "fallo" ] && malos="$malos sitio"
          [ "${{ steps.dominio.outputs.estado }}" = "fallo" ] && malos="$malos dominio"

          if [ -n "$malos" ]; then
            echo "::error::Fallaron:$malos. Revisa los pasos de arriba."
            exit 1
          fi
          echo "Todo en orden."
