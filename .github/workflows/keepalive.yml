
# ─────────────────────────────────────────────────────────────
#  Mantener despierta la base de Supabase
#
#  El plan gratuito de Supabase PAUSA el proyecto tras 7 días
#  sin ninguna petición a la API. Si el pabellón pasa una semana
#  sin visitas, los QR dejarían de mostrar las piezas.
#
#  Este flujo hace una consulta mínima todos los días, así el
#  contador de inactividad nunca llega a 7.
#
#  (Vercel NO se apaga por inactividad: los archivos viven en su
#   CDN. El riesgo real era solo la base de datos.)
# ─────────────────────────────────────────────────────────────
name: Mantener despierta la base

on:
  schedule:
    # Cada 6 horas. Una sola consulta al día no le alcanzaba a Supabase para
    # considerar el proyecto activo: su aviso habla de actividad "suficiente",
    # no de actividad a secas.
    - cron: "0 */6 * * *"
  # permite dispararlo a mano desde la pestaña Actions de GitHub
  workflow_dispatch:

# el token solo necesita poder escribir el sello mensual
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar la base varias veces
        env:
          SUPABASE_URL: https://ffsafqgzggysvxumwemh.supabase.co
          # La "anon key" es pública por diseño (ya vive en config.js).
          # Las políticas RLS son las que protegen los datos.
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmc2FmcWd6Z2d5c3Z4dW13ZW1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NjUxNzAsImV4cCI6MjEwMDU0MTE3MH0.uJtLdBPdE4QQsyHdKSw3zcfq7Ey9ux_VhEEG3SuEEec' }}
        run: |
          # Varias consultas distintas, no una sola: se trata de parecer un
          # archivo en uso, que es lo que Supabase mide, y no un latido
          # mínimo. Son lecturas públicas, las mismas que hace la web.
          fallos=0
          for ruta in \
            "piezas?select=id&limit=1" \
            "piezas?select=id,codigo,nombre_comun&order=orden_display&limit=50" \
            "imagenes?select=id,pieza_id&limit=50" \
            "piezas?select=id&estado_pieza=eq.Bueno&limit=10"
          do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/$ruta" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY")
            echo "  $codigo  <- $ruta"
            [ "$codigo" != "200" ] && fallos=$((fallos+1))
          done

          if [ "$fallos" != "0" ]; then
            echo "::error::Supabase falló en $fallos de 4 consultas. Puede estar pausada: entra a supabase.com/dashboard y toca Restore."
            exit 1
          fi

          echo "Base activa. Contador de inactividad reiniciado."

      - name: Comprobar que el sitio siga en pie
        run: |
          # pabellon414.com es la dirección que llevan impresa los QR de la
          # pared, así que es la que de verdad hay que vigilar. El dominio
          # de Vercel se consulta también, pero solo para poder distinguir
          # un problema del sitio de uno del dominio o del DNS.
          principal=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://pabellon414.com)
          respaldo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://401-amber.vercel.app)
          echo "pabellon414.com      -> HTTP $principal"
          echo "401-amber.vercel.app -> HTTP $respaldo"

          if [ "$principal" != "200" ]; then
            if [ "$respaldo" = "200" ]; then
              echo "::error::pabellon414.com no responde (HTTP $principal) pero Vercel sí. Es el dominio o el DNS: revisa Cloudflare y que el dominio siga renovado. Los QR impresos apuntan a este dominio."
            else
              echo "::error::No responde ni el dominio ni Vercel ($principal / $respaldo). El problema es del sitio, no del DNS."
            fi
            exit 1
          fi

          echo "Sitio en pie."

      # De todo el sistema, lo único verdaderamente irreversible son los QR
      # ya impresos y pegados en la pared: llevan escrito este dominio. Si
      # el dominio caduca, cualquiera puede comprarlo y esas etiquetas pasan
      # a llevar al sitio de un desconocido, sin arreglo posible.
      - name: Vigilar el vencimiento del dominio
        run: |
          fecha=$(curl -s --max-time 20 "https://rdap.verisign.com/com/v1/domain/PABELLON414.COM" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(e['eventDate'] for e in d['events'] if e['eventAction']=='expiration'))" 2>/dev/null || true)

          if [ -z "$fecha" ]; then
            echo "::warning::No se pudo consultar la fecha de vencimiento del dominio."
            exit 0
          fi

          dias=$(( ( $(date -u -d "$fecha" +%s) - $(date -u +%s) ) / 86400 ))
          echo "pabellon414.com vence el ${fecha%%T*} — faltan $dias días."

          if [ "$dias" -lt 30 ]; then
            echo "::error::El dominio vence en $dias días. Renuévalo ya: si caduca, los QR de la pared dejan de funcionar y no hay forma de arreglarlos sin reimprimirlos."
            exit 1
          elif [ "$dias" -lt 60 ]; then
            echo "::warning::El dominio vence en $dias días. Conviene renovarlo con tiempo."
          fi

      # El respaldo de direcciones es lo único que permitiría resucitar los QR
      # ya pegados en la pared si se perdiera todo. Si se agrega una pieza y su
      # dirección no queda anotada ahí, esa etiqueta sería irrecuperable. Por eso
      # se regenera sola: no puede depender de que alguien se acuerde.
      - name: Mantener al día el respaldo de direcciones
        env:
          SUPABASE_URL: https://ffsafqgzggysvxumwemh.supabase.co
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmc2FmcWd6Z2d5c3Z4dW13ZW1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NjUxNzAsImV4cCI6MjEwMDU0MTE3MH0.uJtLdBPdE4QQsyHdKSw3zcfq7Ey9ux_VhEEG3SuEEec' }}
        run: |
          python3 herramientas/generar-direcciones.py

          if [ -z "$(git status --porcelain qr-direcciones.csv QR-DIRECCIONES.md)" ]; then
            echo "El respaldo ya estaba al día."
            exit 0
          fi

          echo "Hay piezas nuevas o cambiadas: se actualiza el respaldo."
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qr-direcciones.csv QR-DIRECCIONES.md
          git commit -m "Actualizar el respaldo de direcciones de los QR"
          git push

      # GitHub desactiva los flujos programados si el repositorio pasa
      # 60 días sin commits. Este sello mensual evita que eso ocurra.
      - name: Sello mensual de actividad
        run: |
          # En la ejecución diaria el sello solo se pone el día 1 del mes.
          # Lanzado a mano se pone siempre, para poder comprobar que el
          # permiso de escritura funciona antes de necesitarlo de verdad.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%d)" != "01" ]; then
            echo "Hoy no toca sello (solo el día 1 de cada mes)."
            exit 0
          fi

          date -u +"Ultima comprobacion automatica: %Y-%m-%d" > .github/ultima-comprobacion.txt

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ultima-comprobacion.txt
          git commit -m "Sello mensual de actividad" || exit 0
          git push
