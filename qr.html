<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pabellón 414 · Códigos QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14180f; --bg2:#1b2015; --bg3:#232a1b;
    --crema:#f7f3ea;
    --tinta:#2c2c26; --tinta-soft:#75705f; --tinta-soft2:#9a9484;
    --oro:#b8934a; --oro-claro:#d4b371;
    --marfil:#ece5d4; --marfil-soft:rgba(236,229,212,.62);
    --linea:rgba(44,44,38,.11); --linea-oro:rgba(184,147,74,.30);
    --serif:'Fraunces',Georgia,serif;
    --sans:'Hanken Grotesk',system-ui,sans-serif;
    --r:12px; --r-lg:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);background:var(--bg);color:var(--marfil);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased}
  a{color:var(--oro);text-decoration:none}
  .serif{font-family:var(--serif)}
  .hide{display:none!important}

  /* ---------- barra superior ---------- */
  .top{position:sticky;top:0;z-index:20;background:rgba(20,24,15,.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--linea-oro);padding:14px 22px;display:flex;align-items:center;
    gap:16px;flex-wrap:wrap}
  .top h1{font-family:var(--serif);font-weight:400;font-size:19px;color:var(--marfil);letter-spacing:.01em}
  .top .cuenta{font-size:12px;color:var(--marfil-soft);letter-spacing:.02em}
  .top .acciones{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
  .btn{font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:.01em;cursor:pointer;
    background:var(--oro);color:#17190f;border:1px solid var(--oro);border-radius:10px;padding:9px 15px;
    transition:filter .2s}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5;cursor:default;filter:none}
  .btn.ghost{background:none;color:var(--oro-claro);border-color:var(--linea-oro)}
  .btn.ghost:hover{background:var(--bg3)}

  /* ---------- explicación y opciones ---------- */
  .intro{padding:22px 22px 0;max-width:900px}
  .intro p{font-size:13.5px;color:var(--marfil-soft);line-height:1.7}
  .opts{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 22px 4px;
    font-size:13px;color:var(--marfil-soft)}
  .opts label{display:flex;align-items:center;gap:7px;cursor:pointer}
  .opts input[type=checkbox]{width:15px;height:15px;accent-color:var(--oro);cursor:pointer}

  /* ---------- pliego de etiquetas ---------- */
  .hoja{padding:22px;display:grid;gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .et{background:#fff;color:var(--tinta);border-radius:var(--r);padding:16px 14px 14px;text-align:center;
    border:1px solid var(--linea);break-inside:avoid}
  .et canvas{width:150px;height:150px;display:block;margin:0 auto;image-rendering:pixelated}
  .et .cod{font-size:9.5px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;
    color:var(--oro);margin-top:12px}
  .et .nom{font-family:var(--serif);font-size:15px;font-weight:500;line-height:1.3;margin-top:4px}
  .et .sala{font-size:10px;color:var(--tinta-soft);margin-top:5px;letter-spacing:.02em}
  .et .marca{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--tinta-soft2);
    margin-top:9px;padding-top:8px;border-top:1px solid var(--linea)}

  .cargando{padding:60px 22px;text-align:center;color:var(--marfil-soft);font-size:14px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--bg3);color:var(--marfil);border:1px solid var(--linea-oro);border-radius:11px;
    padding:11px 18px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%)}

  /* ---------- impresión: A4, tres por fila, listas para recortar ---------- */
  @page{size:A4;margin:12mm}
  @media print{
    body{background:#fff;color:#000}
    .top,.intro,.opts,.cargando,.toast{display:none!important}
    .hoja{padding:0;gap:0;grid-template-columns:repeat(3,1fr)}
    .et{border:1px dashed #bbb;border-radius:0;margin:-0.5px 0 0 -0.5px;padding:10mm 4mm 8mm}
    .et canvas{width:34mm;height:34mm}
  }
</style>
</head>
<body>

<header class="top">
  <h1 class="serif">Códigos QR</h1>
  <span class="cuenta" id="cuenta">cargando…</span>
  <div class="acciones">
    <a class="btn ghost" href="admin.html">← Panel</a>
    <button class="btn ghost" id="btnImprimir">Imprimir / Guardar PDF</button>
    <button class="btn" id="btnZip">Descargar todos (.zip)</button>
  </div>
</header>

<div class="intro">
  <p>Un código por pieza. Cada uno abre directamente la ficha de ese animal en el
     archivo. <b>Descargar todos</b> baja un .zip con un PNG de 900 px por pieza,
     listo para mandar a imprimir; <b>Imprimir</b> arma un pliego A4 de tres por fila
     con línea de corte.</p>
</div>

<div class="opts">
  <label><input type="checkbox" id="optSala" checked> Mostrar la sala en la etiqueta</label>
  <label><input type="checkbox" id="optMarca" checked> Mostrar «Pabellón 414» al pie</label>
</div>

<div class="cargando" id="cargando">Leyendo la colección…</div>
<div class="hoja" id="hoja"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
let PIEZAS = [];

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2600);}

/* La misma URL que genera el panel: la carpeta de este archivo + la ruta de la ficha. */
function piezaUrl(id){
  const base = location.href.split("#")[0].split("?")[0].replace(/[^/]*$/,"");
  return base + "#/pieza/" + encodeURIComponent(id);
}
function nombreArchivo(p){
  const slug = (p.nombreComun||"pieza").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "pieza";
  return `QR-${p.codigo || p.id}-${slug}.png`;
}
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const COLOR = { dark:"#13170D", light:"#ffffff" };

async function pintar(){
  const hoja=$("#hoja");
  hoja.innerHTML = PIEZAS.map((p,i)=>`
    <div class="et">
      <canvas id="c${i}"></canvas>
      <div class="cod">${esc(p.codigo||"")}</div>
      <div class="nom serif">${esc(p.nombreComun||p.id)}</div>
      <div class="sala">${esc(p.sala||"")}</div>
      <div class="marca">Pabellón 414</div>
    </div>`).join("");
  for(let i=0;i<PIEZAS.length;i++){
    // 300 px de lado: se ve nítido en pantalla y también si se imprime esta página.
    await QRCode.toCanvas($("#c"+i), piezaUrl(PIEZAS[i].id),
      { width:300, margin:1, color:COLOR, errorCorrectionLevel:"M" });
  }
  aplicarOpciones();
}

function aplicarOpciones(){
  const sala=$("#optSala").checked, marca=$("#optMarca").checked;
  document.querySelectorAll(".et .sala").forEach(e=>e.classList.toggle("hide",!sala));
  document.querySelectorAll(".et .marca").forEach(e=>e.classList.toggle("hide",!marca));
}
$("#optSala").addEventListener("change",aplicarOpciones);
$("#optMarca").addEventListener("change",aplicarOpciones);

$("#btnImprimir").addEventListener("click",()=>window.print());

$("#btnZip").addEventListener("click", async ()=>{
  const b=$("#btnZip"); b.disabled=true;
  try{
    const zip=new JSZip();
    for(let i=0;i<PIEZAS.length;i++){
      b.textContent=`Generando ${i+1}/${PIEZAS.length}…`;
      // 900 px: suficiente para imprimir la etiqueta a 5 cm sin que se vea el pixelado.
      const url = await QRCode.toDataURL(piezaUrl(PIEZAS[i].id),
        { width:900, margin:2, color:COLOR, errorCorrectionLevel:"M" });
      zip.file(nombreArchivo(PIEZAS[i]), url.split(",")[1], {base64:true});
    }
    b.textContent="Comprimiendo…";
    const blob=await zip.generateAsync({type:"blob"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`QR-Pabellon-414-${new Date().toISOString().slice(0,10)}.zip`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast(`${PIEZAS.length} códigos descargados`);
  }catch(e){
    console.error(e); toast("No se pudo generar el .zip");
  }finally{
    b.disabled=false; b.textContent="Descargar todos (.zip)";
  }
});

(async ()=>{
  PIEZAS = await fetchPiezas();
  $("#cargando").classList.add("hide");
  if(!PIEZAS.length){ $("#cuenta").textContent="no se encontraron piezas"; return; }
  $("#cuenta").textContent = `${PIEZAS.length} piezas`;
  await pintar();
})();
</script>
</body>
</html>
